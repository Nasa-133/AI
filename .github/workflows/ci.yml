name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  service:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [business, ai_runtime, integration_runtime]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Architecture boundaries
        run: uv run lint-imports --no-cache
      - name: Unit tests
        run: uv run pytest -q -m "not integration"
      - name: Build image
        working-directory: .
        run: |
          docker build -f services/${{ matrix.service }}/Dockerfile -t abo-${{ matrix.service }}:ci .

  web:
    name: web (lint, typecheck, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: API tiplari kontraktga mos (generated fayl yangilangan)
        run: npm run -s api:types && git diff --exit-code src/api/schema.d.ts
      - run: npx eslint src e2e
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx next build

  messaging:
    name: abo_messaging (Postgres + RabbitMQ)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/abo_messaging
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: docker compose -f ../../infra/compose/docker-compose.yml up -d --wait postgres rabbitmq
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run mypy
      - run: uv run pytest -q

  repo:
    name: boundaries, contracts, synthetic data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --with pytest --with jsonschema pytest -q tests/architecture tests/contracts tools/synthetic_data/tests

  integration:
    name: integration (Postgres, RabbitMQ, S3, Redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: docker compose -f infra/compose/docker-compose.yml up -d --wait postgres redis rabbitmq objectstore
      - run: make sync
      - run: make migrate
      - name: Migratsiya (gate 8) — toza bazada upgrade/downgrade/upgrade
        run: make migration-check
      - run: make test-integration

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
