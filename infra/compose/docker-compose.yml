name: ai-business-office

x-app-env: &app-env
  env_file:
    - path: ../../.env
      required: false

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
      BUSINESS_DB_OWNER_PASSWORD: ${BUSINESS_DB_OWNER_PASSWORD:-business_owner_dev}
      BUSINESS_DB_APP_PASSWORD: ${BUSINESS_DB_APP_PASSWORD:-business_app_dev}
      AI_DB_OWNER_PASSWORD: ${AI_DB_OWNER_PASSWORD:-ai_owner_dev}
      AI_DB_APP_PASSWORD: ${AI_DB_APP_PASSWORD:-ai_app_dev}
      INTEGRATION_DB_OWNER_PASSWORD: ${INTEGRATION_DB_OWNER_PASSWORD:-integration_owner_dev}
      INTEGRATION_DB_APP_PASSWORD: ${INTEGRATION_DB_APP_PASSWORD:-integration_app_dev}
    ports: ["55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-abo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-abo_dev}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]

  # S3-mos obyekt ombori (lokal). MinIO community image’lari endi ommaviy emas.
  objectstore:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports: ["9000:9000"]
    volumes:
      - objectdata:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  business-api:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: services/business/Dockerfile
    <<: *app-env
    environment:
      BUSINESS_DATABASE_URL: postgresql+asyncpg://business_app:${BUSINESS_DB_APP_PASSWORD:-business_app_dev}@postgres:5432/business
      BUSINESS_MIGRATIONS_DATABASE_URL: postgresql+asyncpg://business_owner:${BUSINESS_DB_OWNER_PASSWORD:-business_owner_dev}@postgres:5432/business
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  business-worker:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: services/business/Dockerfile
    command: ["python", "-m", "business.entrypoints.worker"]
    <<: *app-env
    environment:
      BUSINESS_DATABASE_URL: postgresql+asyncpg://business_app:${BUSINESS_DB_APP_PASSWORD:-business_app_dev}@postgres:5432/business
      BUSINESS_AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER:-abo}:${RABBITMQ_DEFAULT_PASS:-abo_dev}@rabbitmq:5672/
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  ai-runtime:
    profiles: ["apps"]
    build: ../../services/ai_runtime
    <<: *app-env
    ports: ["8100:8100"]

  integration-runtime:
    profiles: ["apps"]
    build: ../../services/integration_runtime
    <<: *app-env
    ports: ["8200:8200"]

volumes:
  pgdata:
  objectdata:
