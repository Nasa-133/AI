name: ai-business-office

x-app-env: &app-env
  env_file:
    - path: ../../.env
      required: false

services:
  postgres:
    networks: [data]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
      BUSINESS_DB_OWNER_PASSWORD: ${BUSINESS_DB_OWNER_PASSWORD:-business_owner_dev}
      BUSINESS_DB_APP_PASSWORD: ${BUSINESS_DB_APP_PASSWORD:-business_app_dev}
      AI_DB_OWNER_PASSWORD: ${AI_DB_OWNER_PASSWORD:-ai_owner_dev}
      AI_DB_APP_PASSWORD: ${AI_DB_APP_PASSWORD:-ai_app_dev}
      INTEGRATION_DB_OWNER_PASSWORD: ${INTEGRATION_DB_OWNER_PASSWORD:-integration_owner_dev}
      INTEGRATION_DB_APP_PASSWORD: ${INTEGRATION_DB_APP_PASSWORD:-integration_app_dev}
    ports: ["55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  rabbitmq:
    networks: [data]
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-abo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-abo_dev}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  redis:
    networks: [data]
    image: redis:7-alpine
    ports: ["56379:6379"]

  # S3-mos obyekt ombori (lokal). MinIO community image’lari endi ommaviy emas.
  objectstore:
    networks: [data]
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports: ["9000:9000"]
    volumes:
      - objectdata:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  business-api:
    networks: [edge, tools, embed, data]
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: services/business/Dockerfile
    <<: *app-env
    environment:
      BUSINESS_DATABASE_URL: postgresql+asyncpg://business_app:${BUSINESS_DB_APP_PASSWORD:-business_app_dev}@postgres:5432/business
      BUSINESS_MIGRATIONS_DATABASE_URL: postgresql+asyncpg://business_owner:${BUSINESS_DB_OWNER_PASSWORD:-business_owner_dev}@postgres:5432/business
      BUSINESS_AI_RUNTIME_URL: http://ai-api:8100
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  business-worker:
    networks: [embed, data]
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: services/business/Dockerfile
    command: ["python", "-m", "business.entrypoints.worker"]
    <<: *app-env
    environment:
      BUSINESS_DATABASE_URL: postgresql+asyncpg://business_app:${BUSINESS_DB_APP_PASSWORD:-business_app_dev}@postgres:5432/business
      BUSINESS_AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER:-abo}:${RABBITMQ_DEFAULT_PASS:-abo_dev}@rabbitmq:5672/
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  ai-worker:
    networks: [tools, data]
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: services/ai_runtime/Dockerfile
    command: ["python", "-m", "ai_runtime.bootstrap.worker"]
    <<: *app-env
    environment:
      AI_DATABASE_URL: postgresql+asyncpg://ai_app:${AI_DB_APP_PASSWORD:-ai_app_dev}@postgres:5432/ai_runtime
      AI_AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER:-abo}:${RABBITMQ_DEFAULT_PASS:-abo_dev}@rabbitmq:5672/
      AI_BUSINESS_TOOLS_URL: http://business-api:8000
      AI_S3_ENDPOINT_URL: http://objectstore:9000
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # Ichki HTTP (faqat /internal/v1/embed va health) — tashqariga port ochilmaydi.
  ai-api:
    networks: [embed, data]
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: services/ai_runtime/Dockerfile
    <<: *app-env

  integration-worker:
    networks: [data]
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: services/integration_runtime/Dockerfile
    command: ["python", "-m", "integration_runtime.bootstrap.worker"]
    <<: *app-env
    environment:
      INTEGRATION_DATABASE_URL: postgresql+asyncpg://integration_app:${INTEGRATION_DB_APP_PASSWORD:-integration_app_dev}@postgres:5432/integration_runtime
      INTEGRATION_AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER:-abo}:${RABBITMQ_DEFAULT_PASS:-abo_dev}@rabbitmq:5672/
      INTEGRATION_S3_ENDPOINT_URL: http://objectstore:9000
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

# TZ 13.12 network egress (lokal ekvivalent): servislar faqat kerakli tarmoqlarda.
# Production’da Kubernetes NetworkPolicy — infra/k8s/network-policies.yaml.
networks:
  edge: {}
  tools: { internal: true }
  embed: { internal: true }
  data: {}

volumes:
  pgdata:
  objectdata:
